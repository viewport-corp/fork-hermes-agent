# Dokploy compose contract for Viewport Hermes.
#
# Dokploy source:
#   source type: git/customGitUrl (no GitHub provider required)
#   customGitUrl: https://github.com/viewport-corp/fork-hermes-agent
#   customGitBranch: main
#   expected commit: 5fc308a70719a83cccdbba4c0e39c23f5a8239d5
#   compose path: deploy/docker-compose.yml
#
# Runtime boundaries:
#   - Deploy only on NEW Dokploy.
#   - Do not use the old host clone at /srv/viewport/forks/hermes-agent.
#   - Load project secrets only from /srv/viewport/secrets/platformx.env.
#   - Preserve the existing state at /srv/viewport/runtime/hermes-viewport-new.
services:
  hermes:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        HERMES_GIT_SHA: 5fc308a70719a83cccdbba4c0e39c23f5a8239d5
    image: viewport-corp/hermes-agent:v2026.8.27-5fc308a
    container_name: hermes-viewport
    restart: unless-stopped
    env_file:
      - /srv/viewport/secrets/platformx.env
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - HERMES_GIT_SHA=5fc308a70719a83cccdbba4c0e39c23f5a8239d5
    volumes:
      - type: bind
        source: /srv/viewport/runtime/hermes-viewport-new
        target: /opt/data
    command: ["gateway", "run"]
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import json,sys; s=json.load(open('/opt/data/gateway_state.json')); sys.exit(0 if s.get('gateway_state') == 'running' and s.get('platforms', {}).get('telegram', {}).get('state') == 'connected' else 1)\"",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
        window: 120s
    labels:
      - "viewport.tier=tier-0"
      - "viewport.role=operator-harness"
      - "viewport.source=github"
      - "viewport.hermes.release=v2026.8.27"
      - "viewport.hermes.commit=5fc308a70719a83cccdbba4c0e39c23f5a8239d5"
      - "traefik.enable=false"
