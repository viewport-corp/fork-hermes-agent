# Dokploy compose contract for Viewport Hermes.
#
# Dokploy source:
#   source type: git/customGitUrl (no GitHub provider required)
#   customGitUrl: https://github.com/viewport-corp/fork-hermes-agent.git
#   customGitBranch: main
#   compose path: deploy/docker-compose.yml
#   composeId: kl7tmNAE6_kbE_c7q6l2I
#
# Image: the OFFICIAL upstream release image, pinned by tag AND digest
# (release v2026.9.24, peeled commit f97608f178d1ffeca59860195ab7da295f7c8e5f,
# which is also the image's org.opencontainers.image.revision label).
#
# Runtime boundaries:
#   - Deploy only on NEW Dokploy (docker-viewport daemon).
#   - State is the LIVE folder /srv/viewport/runtime/hermes-viewport-v2026-8-27.
#     Take the full backup in dokploy.desired-state.json rollback.backupBeforeDeploy first.
#   - The upstream entrypoint is kept (s6-overlay /init as PID 1). It starts as root
#     and drops every supervised process to the image's hermes user (UID 10000).
#     Do not set `user:`; upstream stage2-hook.sh refuses arbitrary --user UIDs.
#   - The legacy /opt/data/.env stays. Upstream reads it (override=True), so every key
#     it holds wins over the values below; keep them equal (hash check only).
#   - Secret VALUES live only in the Dokploy compose env (written next to this file
#     as .env by Dokploy). Git holds env var NAMES only.
#   - HERMES_TELEGRAM_BOT_TOKEN is Hermes' OWN bot. Never copy platformx.env
#     TELEGRAM_BOT_TOKEN (OpenClaw's bot) into it: two pollers on one bot = Telegram 409.
name: fork-hermes-agent

x-hermes-image: &hermes-image docker.io/nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7

services:
  hermes:
    image: *hermes-image
    pull_policy: if_not_present
    container_name: hermes-viewport
    restart: unless-stopped
    command: ["gateway", "run"]
    network_mode: bridge
    ports:
      # The edge route /etc/dokploy/traefik/dynamic/viewport-hermes.yml targets http://127.0.0.1:9119.
      - "127.0.0.1:9119:9119"
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_TELEGRAM_DISABLE_FALLBACK_IPS: "true"
      GATEWAY_ALLOW_ALL_USERS: "false"
      TELEGRAM_BOT_TOKEN: ${HERMES_TELEGRAM_BOT_TOKEN:?set Hermes own bot token; must equal TELEGRAM_BOT_TOKEN in the live Hermes .env, never platformx.env TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:?set Hermes Telegram allowlist}
      TELEGRAM_HOME_CHANNEL: ${TELEGRAM_HOME_CHANNEL:-}
      TELEGRAM_HOME_CHANNEL_NAME: ${TELEGRAM_HOME_CHANNEL_NAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?set dashboard basic auth username}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?set dashboard basic auth password}
      # Session signing key (32+ random bytes). Blank = random per process, so dashboard logins drop on every restart.
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Read by config.yaml fallback_providers entries through key_env (LiteLLM virtual key alias hermes-viewport).
      LITELLM_HERMES_KEY: ${LITELLM_HERMES_KEY:?set LiteLLM virtual key for the Hermes fallback chain}
    volumes:
      - type: bind
        source: /srv/viewport/runtime/hermes-viewport-v2026-8-27
        target: /opt/data
        bind:
          create_host_path: false
      # Live feature: Hermes runs docker commands against the viewport daemon (ops agent).
      # Upstream stage2-hook.sh adds the socket's GID (988) to the hermes user; no group_add needed.
      - type: bind
        source: /run/docker-viewport.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: /srv/viewport
        target: /host/srv/viewport
        bind:
          create_host_path: false
      - type: bind
        source: /opt/platformx
        target: /host/opt/platformx
        bind:
          create_host_path: false
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json,sys,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:9119/api/health', timeout=5); data=json.load(r); sys.exit(0 if getattr(r, 'status', 200) == 200 and data.get('ok') is True else 1)"
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
    labels:
      - "viewport.tier=tier-0"
      - "viewport.role=operator-harness"
      - "viewport.source=github"
      - "viewport.hermes.release=v2026.9.24"
      - "viewport.hermes.upstream_release_commit=f97608f178d1ffeca59860195ab7da295f7c8e5f"
      - "traefik.enable=false"
