# /srv/viewport/deploy/hermes/docker-compose.yml
# Build context = upstream fork at /srv/viewport/forks/hermes-agent
# Daemon = docker-viewport (DOCKER_HOST=unix:///var/run/docker-viewport.sock)
# Network = bridge on dvp0 (NOT host mode — overrides upstream)
# Auth = Codex OAuth via /srv/viewport/runtime/hermes/.codex/auth.json (chown 10000:10000)
services:
  gateway:
    build:
      context: /srv/viewport/forks/hermes-agent
      dockerfile: Dockerfile
    image: viewport-corp/hermes-agent:v0.12.0
    container_name: hermes
    restart: unless-stopped
    networks: [viewport]
    env_file: /srv/viewport/secrets/hermes.env
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
    volumes:
      - /srv/viewport/runtime/hermes:/opt/data
    command: ["gateway", "run"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8642/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - "viewport.tier=tier-0"
      - "viewport.role=operator-harness"
      - "traefik.enable=false"

networks:
  viewport:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: viewport0
