# Git-owned isolated Dokploy stage compose for Hermes.
#
# This is intentionally separate from deploy/docker-compose.yml because production
# state, published ports, bot tokens and other secrets must not be reused for stage.
# Stage runs the same OFFICIAL upstream image family as production. It receives no
# secrets at all. Its guard refuses to start if the stage state holds a legacy .op.env,
# a symlinked .env, or a .env with a non-empty production secret (a copied live Telegram
# token would fight the live bot with a 409). A .env without those keys is allowed: the
# upstream image creates one on first boot (stage2-hook.sh seed_one + API_SERVER_KEY).
name: ${HERMES_STAGE_PROJECT_NAME:?set isolated Dokploy stage project name}

x-hermes-stage-image: &hermes-stage-image ${HERMES_STAGE_IMAGE:?set immutable docker.io/nousresearch/hermes-agent:<tag>@sha256:<digest> for stage}

services:
  hermes-stage:
    image: *hermes-stage-image
    pull_policy: if_not_present
    container_name: ${HERMES_STAGE_CONTAINER_NAME:?set isolated stage container name}
    restart: unless-stopped
    # Guard on every start, then hand over to the upstream entrypoint with exec (keeps PID 1
    # for s6 /init). The key classes match secrets.forbiddenProductionSecretClasses.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -e /opt/data/.op.env ] || [ -L /opt/data/.op.env ]; then
          echo "Hermes stage state holds legacy env file /opt/data/.op.env; recopy state with the .env* exclude list" >&2
          exit 78
        fi
        if [ -L /opt/data/.env ]; then
          echo "Hermes stage state /opt/data/.env is a symlink; recopy state with the .env* exclude list" >&2
          exit 78
        fi
        if [ -f /opt/data/.env ] && grep -Eq "^[[:space:]]*(export[[:space:]]+)?(TELEGRAM_[A-Z0-9_]*|HERMES_DASHBOARD_[A-Z0-9_]*|OPENAI_API_KEY|ANTHROPIC_API_KEY|OPENROUTER_API_KEY|GITHUB_TOKEN[A-Z0-9_]*)[[:space:]]*=[[:space:]]*([^[:space:]#\"']|\"[^\"]|'[^'])" /opt/data/.env; then
          echo "Hermes stage state /opt/data/.env holds a production secret key; recopy state with the .env* exclude list" >&2
          exit 78
        fi
        exec /opt/hermes/docker/entrypoint-dispatch.sh "$$@"
      - hermes-stage-guard
    command: ["gateway", "run"]
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - HERMES_DASHBOARD=true
      - HERMES_DASHBOARD_HOST=127.0.0.1
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_GATEWAY_BOOTSTRAP_STATE=running
    networks:
      stage:
        ipv4_address: ${HERMES_STAGE_IPV4_ADDRESS:?set isolated stage container IP inside HERMES_STAGE_SUBNET}
    volumes:
      - type: bind
        source: ${HERMES_STAGE_STATE_DIR:?set isolated stage state dir, not production state}
        target: /opt/data
        bind:
          create_host_path: false
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json,sys,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:9119/api/health', timeout=5); data=json.load(r); sys.exit(0 if getattr(r, 'status', 200) == 200 and data.get('ok') is True else 1)"
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
    labels:
      - "viewport.tier=stage"
      - "viewport.role=operator-harness-stage"
      - "viewport.source=github"
      - "viewport.hermes.stage=true"
      - "traefik.enable=false"

networks:
  stage:
    name: ${HERMES_STAGE_NETWORK_NAME:?set isolated stage network name}
    ipam:
      config:
        - subnet: ${HERMES_STAGE_SUBNET:?set isolated stage subnet CIDR}
